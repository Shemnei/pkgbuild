name: Upstream releases

on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report releases without creating issues
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: upstream-release-issues
  cancel-in-progress: false

jobs:
  releases:
    name: Check upstream releases
    permissions:
      contents: read
      issues: write # Create release notifications and assign them to the maintainer.
    # Scheduled and manual issue creation only executes trusted default-branch code.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Report newer stable releases
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_ISSUE_ASSIGNEE: ${{ vars.UPSTREAM_ISSUE_ASSIGNEE || github.repository_owner }}
          DRY_RUN: ${{ inputs.dry-run || false }}
        run: |
          if [[ "$DRY_RUN" == true ]]; then
            python -B -m support.upstream --dry-run
          else
            python -B -m support.upstream
          fi
